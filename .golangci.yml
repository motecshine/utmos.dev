# Configuration for golangci-lint v2
# See https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Core linters
    - errcheck
    - govet
    - ineffassign
    - unused
    # Code quality
    - gocyclo
    - goconst
    - dupl
    # Security
    - gosec
    # Error handling
    - errorlint
    - wastedassign
    # Type safety
    - forcetypeassert
    # Style
    - revive
    # Receiver consistency
    - recvcheck
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - unusedwrite
    gocyclo:
      min-complexity: 30
    gosec:
      excludes:
        - G101 # False positive: hardcoded credentials in test URLs
        - G107 # HTTP request with variable URL: all URLs sourced from admin config, not user input
        - G115 # Safe integer conversions: QoS (0-2), config batch sizes
        - G117 # False positive: struct fields matching secret patterns
        - G304 # File path from variable: sourced from os.CreateTemp, not user input
        - G401 # MD5 usage: required by DJI Cloud protocol spec for file checksums, not for crypto
        - G501 # MD5 import: required by DJI Cloud protocol spec for file integrity checksums
        - G703 # Path traversal via taint: paths from os.CreateTemp, not user input
        - G704 # SSRF via taint: URLs from admin configuration, not user input
    dupl:
      threshold: 150
    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocritic
          - dupl
          - revive
          - forcetypeassert

issues:
  max-issues-per-linter: 200
  max-same-issues: 50
